services:
  - type: web
    name: co-po-backend
    env: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_ENGINE_URL
        sync: false
      - key: ANALYTICS_ENGINE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
  - type: web
    name: co-po-ai-engine
    env: python
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main_ai_router:app --host 0.0.0.0 --port 8000
    envVars:
      - key: GEMINI_API_KEY
        sync: false
  - type: web
    name: co-po-analytics-engine
    env: python
    rootDir: analytics-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main_analytics_router:app --host 0.0.0.0 --port 8001
  - type: web
    name: co-po-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
